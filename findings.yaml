# MP041 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G095"          # your group id, e.g. "G042"
problem_id: "MP041"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: True
    column: fare_paid_receipt_rs          # the column that must not be used as a feature
  unit_mixup:
    present: True
    column: distance_km           # the column recorded in a different unit
    group_value: Market      # the value of zone whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: False
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: True
    count: 44          # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: True
    column: "fuel_price_rs"        # the column that is stuck
    start_date: "2026-03-26"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-09"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: True
    count: 10            # rows whose target was typed 10 times too big
  spelling_variants:
    present: False
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "G095_MP041"
  best_run_id: "3cfea4342a22433fa2b2782465a16fd2"        # the MLflow run id of your v1 model
  registered_model_name: "G095_MP041_Fare_Model"
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    distance_km: null
    wait_min: null
    passengers: null
    hour: null
    luggage_bags: null
    fuel_price_rs: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of zone
    'Station Area': null
    'Market': null
    'Outskirts': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
